name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    uses: remonenaidoo/swiftbets-platform/.github/workflows/dotnet.yml@main
    with:
      images: '[{"name": "swiftbets-placement", "dockerfile": "deploy/SwiftBets.Placement.Api.Dockerfile"}, {"name": "swiftbets-placement-migrator", "dockerfile": "deploy/SwiftBets.Placement.Migrator.Dockerfile"}]'
      coverage: true
      # Branch floors on money-path code (D103): a few points under what is measured, raised as tests grow.
      coverage-floors: '{"SwiftBets.Placement.Domain": {"branch": 70}, "SwiftBets.Placement.Application": {"branch": 55}}'
    permissions:
      contents: read
      packages: write
      security-events: write
